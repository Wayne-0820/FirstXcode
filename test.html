<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>經濟計算驗算</title>
<style>
  body { font-family: -apple-system, "PingFang TC", sans-serif;
         background: #0e1015; color: #e8eaf0; padding: 24px; line-height: 1.6; }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .sub { color: #8b93a7; font-size: 13px; margin-bottom: 20px; }
  #summary { font-size: 16px; font-weight: 700; padding: 12px 14px;
             border-radius: 10px; margin-bottom: 16px; }
  .ok   { background: #12301f; color: #4ade80; }
  .bad  { background: #3a1418; color: #f87171; }
  .case { font-size: 13px; padding: 5px 0; border-bottom: 1px solid #272c38;
          font-variant-numeric: tabular-nums; }
  .pass::before { content: "✓ "; color: #4ade80; }
  .fail::before { content: "✗ "; color: #f87171; }
  .fail { color: #f87171; }
  .detail { color: #8b93a7; font-size: 12px; padding-left: 16px; }
</style>
</head>
<body>

<h1>經濟計算驗算</h1>
<div class="sub">
  economy.js 全是純函式，所以可以直接驗算。<br>
  改過 economy.js 之後開這頁看一眼，確定沒把數學弄壞。
</div>
<div id="summary"></div>
<div id="results"></div>

<script src="js/content.js"></script>
<script src="js/economy.js"></script>
<script src="js/state.js"></script>
<script>
let passed = 0, failed = 0;
const out = document.getElementById("results");

function log(ok, name, detail) {
  const d = document.createElement("div");
  d.className = "case " + (ok ? "pass" : "fail");
  d.textContent = name;
  out.appendChild(d);
  if (detail && !ok) {
    const x = document.createElement("div");
    x.className = "detail";
    x.textContent = detail;
    out.appendChild(x);
  }
  ok ? passed++ : failed++;
}

function eq(name, actual, expected, tolerance = 1e-6) {
  const ok = Math.abs(actual - expected) <= tolerance * Math.max(1, Math.abs(expected));
  log(ok, name, `得到 ${actual}，預期 ${expected}`);
}

function is(name, actual, expected) {
  log(actual === expected, name, `得到 ${JSON.stringify(actual)}，預期 ${JSON.stringify(expected)}`);
}

// 測試用的假產生器：數字挑好算的
const G = { baseCost: 100, costGrowth: 1.15, baseRate: 1 };
const FLAT = { baseCost: 10, costGrowth: 1, baseRate: 1 };  // 不漲價，會踩到除以零

// --- costOf --------------------------------------------------
eq("costOf：第 1 個 = baseCost", Economy.costOf(G, 0), 100);
eq("costOf：已有 1 個 → ×1.15", Economy.costOf(G, 1), 115);
eq("costOf：已有 5 個 → ×1.15^5", Economy.costOf(G, 5), 100 * Math.pow(1.15, 5));

// --- costOfN：等比級數和（最容易寫錯的地方）------------------
eq("costOfN：買 0 個 = 0", Economy.costOfN(G, 0, 0), 0);
eq("costOfN：買 1 個 = costOf", Economy.costOfN(G, 0, 1), Economy.costOf(G, 0));
eq("costOfN：買 2 個 = 前兩個相加", Economy.costOfN(G, 0, 2), 100 + 115);
eq("costOfN：從第 3 個起買 2 個",
   Economy.costOfN(G, 2, 2), Economy.costOf(G, 2) + Economy.costOf(G, 3));

// 這條是關鍵：跟「一個一個加起來」比對。
// 如果有人把 costOfN 寫成 costOf × n，這裡就會炸。
(() => {
  for (const [owned, n] of [[0, 10], [3, 25], [17, 100], [50, 250]]) {
    let sum = 0;
    for (let i = 0; i < n; i++) sum += Economy.costOf(G, owned + i);
    eq(`costOfN：公式 = 逐個累加（已有 ${owned} 個，買 ${n} 個）`,
       Economy.costOfN(G, owned, n), sum, 1e-9);
  }
})();

eq("costOfN：growth = 1 不會除以零", Economy.costOfN(FLAT, 5, 7), 70);

// --- maxAffordable：反函式 -----------------------------------
is("maxAffordable：沒錢 = 0", Economy.maxAffordable(G, 0, 0), 0);
is("maxAffordable：錢不夠買第 1 個 = 0", Economy.maxAffordable(G, 0, 99), 0);
is("maxAffordable：剛好買得起 1 個", Economy.maxAffordable(G, 0, 100), 1);
is("maxAffordable：差 1 塊買不到第 2 個", Economy.maxAffordable(G, 0, 214), 1);
is("maxAffordable：剛好買得起 2 個", Economy.maxAffordable(G, 0, 215), 2);
is("maxAffordable：growth = 1", Economy.maxAffordable(FLAT, 0, 95), 9);
is("maxAffordable：負的錢 = 0", Economy.maxAffordable(G, 0, -50), 0);

// 反函式和 costOfN 必須完全自洽：
// 買得起 n 個，而且真的買不起 n+1 個。這條測完就不用擔心買到負債。
(() => {
  let allOk = true, note = "";
  for (const owned of [0, 1, 7, 40, 200]) {
    for (const money of [0, 1, 99, 100, 1e3, 1e5, 1e9, 1e15, 1e30]) {
      const n = Economy.maxAffordable(G, owned, money);
      if (n < 0) { allOk = false; note = `n 是負的：owned=${owned} money=${money}`; break; }
      if (n > 0 && Economy.costOfN(G, owned, n) > money) {
        allOk = false; note = `買不起卻說買得起：owned=${owned} money=${money} n=${n}`; break;
      }
      if (Economy.costOfN(G, owned, n + 1) <= money) {
        allOk = false; note = `還能多買一個卻沒算到：owned=${owned} money=${money} n=${n}`; break;
      }
    }
    if (!allOk) break;
  }
  log(allOk, "maxAffordable 與 costOfN 完全自洽（掃過各種持有數與金額）", note);
})();

// --- 產量 ----------------------------------------------------
eq("rateOf：0 個 = 0", Economy.rateOf(G, 0), 0);
eq("rateOf：12 個", Economy.rateOf(G, 12), 12);

// 用 State.create() 當底，欄位才不會漏 —— 手刻的假 state 很容易忘記加新欄位，
// 然後測試就在測一個現實中不存在的狀態。
const blankState = (realm = 0) => {
  const s = State.create();
  s.realm = realm;
  return s;
};

// 底下好幾個區塊都會用到，宣告在最前面。
// （放在後面的話，前面的區塊一碰就會踩到 const 的暫時性死區，整個腳本直接爆掉。）
const bossPet = CONTENT.pets.find((p) => !p.cost);      // 打魔王收服的
const shopPet = CONTENT.pets.find((p) => p.cost > 0);   // 商店用悟性請的
const talisman = CONTENT.consumables.find((c) => c.effect === "guaranteeBreakthrough");
const buffOutcome = CONTENT.fortunes.outcomes.find((o) => o.type === "buff" && o.value > 1);
const demonOutcome = CONTENT.fortunes.outcomes.find((o) => o.value < 1);
const always = (v) => () => v;  // 注入用的假 rng

(() => {
  const state = blankState();
  eq("totalRate：全空 = 0", Economy.totalRate(state), 0);

  const first = CONTENT.generators[0];
  state.owned[first.id] = 10;
  eq("totalRate：只有第一種 10 個（凡人 ×1）", Economy.totalRate(state), 10 * first.baseRate);

  // 境界倍率要真的乘進去 —— 這是整個突破系統的回報
  const last = CONTENT.realms.length - 1;
  state.realm = last;
  eq(`totalRate：同樣的設施在最高境界（×${CONTENT.realms[last].multiplier}）`,
     Economy.totalRate(state), 10 * first.baseRate * CONTENT.realms[last].multiplier);
})();

// --- 境界 ----------------------------------------------------
is("realmAt：0 = 第一個境界", Economy.realmAt(0).name, CONTENT.realms[0].name);
is("realmAt：負的索引夾到 0", Economy.realmAt(-3).name, CONTENT.realms[0].name);
is("realmAt：超出範圍夾到最後一個",
   Economy.realmAt(9999).name, CONTENT.realms[CONTENT.realms.length - 1].name);
is("realmAt：undefined 不會爆（存檔壞掉時）", Economy.realmAt(undefined).name, CONTENT.realms[0].name);
is("realmAt：NaN 不會爆", Economy.realmAt(NaN).name, CONTENT.realms[0].name);

is("nextRealm：凡人的下一關", Economy.nextRealm(blankState(0)).name, CONTENT.realms[1].name);
is("nextRealm：最高境界沒有下一關 = null",
   Economy.nextRealm(blankState(CONTENT.realms.length - 1)), null);

(() => {
  const need = CONTENT.realms[1].requirement;
  const s = blankState(0);

  s.money = need - 1;
  is("canBreakthrough：差 1 點靈氣 → 不行", Economy.canBreakthrough(s), false);
  s.money = need;
  is("canBreakthrough：剛好夠 → 可以", Economy.canBreakthrough(s), true);
  s.money = need * 100;
  is("canBreakthrough：遠遠超過 → 可以", Economy.canBreakthrough(s), true);

  s.money = 0;
  eq("breakthroughProgress：0 靈氣 = 0", Economy.breakthroughProgress(s), 0);
  s.money = need / 2;
  eq("breakthroughProgress：一半 = 0.5", Economy.breakthroughProgress(s), 0.5);
  s.money = need * 5;
  eq("breakthroughProgress：超過也不會大於 1", Economy.breakthroughProgress(s), 1);

  const maxed = blankState(CONTENT.realms.length - 1);
  maxed.money = 1e30;
  is("canBreakthrough：最高境界不能再突破", Economy.canBreakthrough(maxed), false);
  eq("breakthroughProgress：最高境界 = 1", Economy.breakthroughProgress(maxed), 1);
})();

// --- 突破：成功 ----------------------------------------------
// rng 是注入的，所以隨機性測得到。always(0) = 必定成功、always(0.999) = 幾乎必定失敗。
(() => {
  const s = blankState(0);
  const first = CONTENT.generators[0];
  s.owned[first.id] = 30;
  s.techniques[CONTENT.techniques[0].id] = true;
  s.money = CONTENT.realms[1].requirement;
  s.totalEarned = 99999;
  s.insight = 7;

  const got = State.breakthrough(s, always(0));
  log(got && got.success === true && got.realm.name === CONTENT.realms[1].name,
      "breakthrough 成功：回傳 success 與新境界", `得到 ${JSON.stringify(got && got.realm && got.realm.name)}`);
  is("breakthrough 成功：境界 +1", s.realm, 1);
  is("breakthrough 成功：靈氣歸零", s.money, 0);
  is("breakthrough 成功：修煉設施散去", s.owned[first.id], 0);
  is("breakthrough 成功：功法也散去", Object.keys(s.techniques).length, 0);
  is("breakthrough 成功：突破次數 +1", s.breakthroughs, 1);
  is("breakthrough 成功：悟性有入帳", s.insight > 7, true);
  is("breakthrough 成功：歷代累計不歸零（那是總戰績）", s.totalEarned, 99999);

  is("breakthrough：靈氣不足時回傳 null", State.breakthrough(s, always(0)), null);
  is("breakthrough：回傳 null 時境界不變", s.realm, 1);
})();

// --- 突破：失敗 ----------------------------------------------
// Wayne 選的規則：失敗只損失靈氣，境界、設施、功法全部保留。
(() => {
  const s = blankState(9); // 渡劫，成功率 0.55
  const first = CONTENT.generators[0];
  s.owned[first.id] = 30;
  s.techniques[CONTENT.techniques[0].id] = true;
  s.money = CONTENT.realms[10].requirement;
  s.insight = 5;

  const got = State.breakthrough(s, always(0.999));
  log(got && got.success === false, "breakthrough 失敗：回傳 success = false", JSON.stringify(got));
  is("breakthrough 失敗：靈氣歸零（這是代價）", s.money, 0);
  is("breakthrough 失敗：境界不變", s.realm, 9);
  is("breakthrough 失敗：修煉設施保留", s.owned[first.id], 30);
  is("breakthrough 失敗：功法保留", Object.keys(s.techniques).length, 1);
  is("breakthrough 失敗：悟性不變", s.insight, 5);
  is("breakthrough 失敗：失敗次數 +1", s.failures, 1);
})();

// 成功率 100% 的境界，rng 回傳 0.999 也必須成功
(() => {
  const s = blankState(0);
  s.money = CONTENT.realms[1].requirement;
  const got = State.breakthrough(s, always(0.9999999));
  log(got && got.success === true,
      "breakthrough：成功率 100% 時擲出最差值也不能失敗", JSON.stringify(got));
})();

// --- 渡劫成功率 ----------------------------------------------
(() => {
  const s = blankState(0);
  eq("successRate：前期境界穩過", Economy.successRate(s), 1);

  const risky = blankState(9); // 渡劫
  eq("successRate：渡劫的基礎成功率", Economy.successRate(risky), CONTENT.realms[10].successRate);

  // 法寶會往上加
  const trib = CONTENT.treasures.filter((b) => b.effect === "tribulation");
  risky.treasures[trib[0].id] = true;
  eq("successRate：法寶加成有生效",
     Economy.successRate(risky), CONTENT.realms[10].successRate + trib[0].value);

  // 全部堆上去也不能超過 100%
  for (const b of trib) risky.treasures[b.id] = true;
  const capped = Economy.successRate(risky);
  log(capped <= 1, "successRate：疊滿法寶也不會超過 100%", "得到 " + capped);

  const maxed = blankState(CONTENT.realms.length - 1);
  eq("successRate：最高境界沒有下一關 = 1", Economy.successRate(maxed), 1);
})();

// --- 悟性 ----------------------------------------------------
(() => {
  const s = blankState(0);
  const need = CONTENT.realms[1].requirement;
  const base = CONTENT.realms[1].insight;

  s.money = need;
  is("insightGain：剛好達標拿到基礎值", Economy.insightGain(s), base);

  // 開根號遞減：囤 4 倍靈氣只換到 2 倍悟性
  s.money = need * 4;
  is("insightGain：囤 4 倍靈氣 → 2 倍悟性（開根號遞減）", Economy.insightGain(s), base * 2);
  s.money = need * 100;
  is("insightGain：囤 100 倍 → 10 倍", Economy.insightGain(s), base * 10);

  // 囤得少不會扣，也不會是 0
  s.money = need / 2;
  is("insightGain：不足門檻時不會低於基礎值", Economy.insightGain(s), base);

  const maxed = blankState(CONTENT.realms.length - 1);
  is("insightGain：最高境界 = 0", Economy.insightGain(maxed), 0);
})();

// --- 功法 ----------------------------------------------------
(() => {
  const s = blankState(0);
  const f = CONTENT.techniques.find((x) => x.target === "click");

  eq("techniqueMult：沒買 = 1", Economy.techniqueMult(s, "click"), 1);
  s.techniques[f.id] = true;
  eq("techniqueMult：買了就生效", Economy.techniqueMult(s, "click"), f.multiplier);
  eq("clickPower：功法有乘進去", Economy.clickPower(s), CONTENT.clickPower * f.multiplier);

  // 上架條件：要先擁有足夠的加成目標
  const gf = CONTENT.techniques.find((x) => x.requireOwned > 0);
  const s2 = blankState(0);
  is("techniqueAvailable：目標數量不夠 → 不上架", Economy.techniqueAvailable(s2, gf), false);
  s2.owned[gf.target] = gf.requireOwned;
  is("techniqueAvailable：數量夠了 → 上架", Economy.techniqueAvailable(s2, gf), true);
  s2.techniques[gf.id] = true;
  is("techniqueAvailable：買過了就不再上架", Economy.techniqueAvailable(s2, gf), false);
})();

// --- 法寶 ----------------------------------------------------
(() => {
  const s = blankState(0);
  const b = CONTENT.treasures.find((x) => x.effect === "allRate");

  eq("treasureMult：沒買 = 1", Economy.treasureMult(s, "allRate"), 1);
  s.treasures[b.id] = true;
  eq("treasureMult：買了就生效", Economy.treasureMult(s, "allRate"), b.value);

  // 離線上限是加法
  const off = CONTENT.treasures.find((x) => x.effect === "offlineHours");
  const s2 = blankState(0);
  eq("offlineCapSeconds：基礎值", Economy.offlineCapSeconds(s2), CONTENT.offlineCapHours * 3600);
  s2.treasures[off.id] = true;
  eq("offlineCapSeconds：法寶加的小時數",
     Economy.offlineCapSeconds(s2), (CONTENT.offlineCapHours + off.value) * 3600);
  eq("clampElapsed：上限跟著法寶變長",
     State.clampElapsed(1e9, s2), (CONTENT.offlineCapHours + off.value) * 3600);
})();

// --- 買東西 --------------------------------------------------
(() => {
  const s = blankState(0);
  const f = CONTENT.techniques.find((x) => x.target === "click");

  s.money = f.cost - 1;
  is("buyTechnique：靈氣不夠買不了", State.buyTechnique(s, f.id), false);
  is("buyTechnique：買不了就不扣錢", s.money, f.cost - 1);

  s.money = f.cost + 500;
  is("buyTechnique：夠錢就買得到", State.buyTechnique(s, f.id), true);
  is("buyTechnique：有扣錢", s.money, 500);
  is("buyTechnique：不能重複買", State.buyTechnique(s, f.id), false);
  is("buyTechnique：亂給 id 不會爆", State.buyTechnique(s, "根本不存在"), false);

  const b = CONTENT.treasures[0];
  const s2 = blankState(0);
  s2.insight = b.cost - 1;
  is("buyTreasure：悟性不夠買不了", State.buyTreasure(s2, b.id), false);
  s2.insight = b.cost + 2;
  is("buyTreasure：夠悟性就買得到", State.buyTreasure(s2, b.id), true);
  is("buyTreasure：有扣悟性", s2.insight, 2);
  is("buyTreasure：不能重複買", State.buyTreasure(s2, b.id), false);
  is("buyTreasure：法寶不該花到靈氣", s2.money, 0);
})();

// --- 打坐：這次修正的重點 ------------------------------------
(() => {
  const s = blankState(0);
  // 前期還沒有產量，這時打坐只有定額底線撐著
  eq("clickPower：沒產量時 = 定額底線", Economy.clickPower(s), CONTENT.clickPower);

  const gen = CONTENT.generators[0];
  s.owned[gen.id] = 100;
  const rate = Economy.totalRate(s);
  eq("clickPower：有產量後 = 底線 + 產量×分成",
     Economy.clickPower(s), CONTENT.clickPower + rate * CONTENT.clickShare);

  // 法寶的分成是加法
  const sh = CONTENT.treasures.filter((b) => b.effect === "clickShare");
  eq("clickShare：基礎值", Economy.clickShare(s), CONTENT.clickShare);
  s.treasures[sh[0].id] = true;
  eq("clickShare：法寶加上去", Economy.clickShare(s), CONTENT.clickShare + sh[0].value);
  s.treasures[sh[1].id] = true;
  eq("clickShare：兩件疊加",
     Economy.clickShare(s), CONTENT.clickShare + sh[0].value + sh[1].value);
})();

// ★ 整個修正的意義就在這一條。
// 修正前 clickPower 是個定額，「打坐值幾秒的產量」會從 7.5 秒一路掉到 0.0000 秒 ——
// 到金丹之後打坐就是裝飾品。改成給產量分成後，它在每個境界都值同樣的秒數。
(() => {
  const ratios = [];
  for (const [i, realm] of CONTENT.realms.entries()) {
    const s = State.create();
    s.realm = i;
    for (const g of CONTENT.generators) s.owned[g.id] = 20;
    const rate = Economy.totalRate(s);
    if (rate > 0) ratios.push({ 境界: realm.name, 值幾秒: Economy.clickPower(s) / rate });
  }
  // 後期定額項可以忽略，比例應該收斂到 clickShare
  const late = ratios.slice(2);
  const ok = late.every((r) => Math.abs(r.值幾秒 - CONTENT.clickShare) < CONTENT.clickShare * 0.01);
  log(ok,
      `打坐：每個境界都值 ${(CONTENT.clickShare * 100).toFixed(0)}% 的產量，不會隨境界歸零`,
      late.map((r) => `${r.境界}:${r.值幾秒.toFixed(4)}秒`).join(" "));

  // 講白一點：最高境界的打坐效益不能比前期差
  const first = ratios[0].值幾秒, last = ratios[ratios.length - 1].值幾秒;
  log(last >= first * 0.99,
      "打坐：飛昇時的打坐效益不會低於煉氣時（修正前會差幾萬倍）",
      `煉氣 ${first.toFixed(4)}秒 → 飛昇 ${last.toFixed(4)}秒`);
})();

// --- 機緣：增益 ----------------------------------------------
(() => {
  const s = blankState(0);
  const now = 1000000;
  eq("buffMult：沒增益 = 1", Economy.buffMult(s, buffOutcome.effect, now), 1);

  s.buffs[buffOutcome.id] = now + 5000;
  eq("buffMult：增益生效", Economy.buffMult(s, buffOutcome.effect, now), buffOutcome.value);
  eq("buffRemaining：還剩 5 秒", Economy.buffRemaining(s, buffOutcome.id, now), 5);

  // 過期的增益還在生效是最難查的那種 bug
  eq("buffMult：過期就不算（剛好到期）",
     Economy.buffMult(s, buffOutcome.effect, now + 5000), 1);
  eq("buffMult：過期就不算（超過）",
     Economy.buffMult(s, buffOutcome.effect, now + 99999), 1);
  eq("buffRemaining：過期 = 0", Economy.buffRemaining(s, buffOutcome.id, now + 9999), 0);

  eq("buffMult：效果類型不符就不給", Economy.buffMult(s, "nope", now), 1);
})();

(() => {
  // 心魔是減益，要真的把產量打下去。
  //
  // 這裡必須用真的 Date.now()：totalRate 內部拿的是 Date.now() 去比對到期，
  // 不像 buffMult 可以注入。用假時間戳的話那個增益在它眼中早就過期了。
  const s = blankState(2);
  for (const g of CONTENT.generators) s.owned[g.id] = 10;
  const before = Economy.totalRate(s);

// ★ 真的模擬一次通關，而不是比對數值的成長比。
//
// 舊版這裡只比「門檻成長 ÷ 倍率成長」就說每關 2 倍時間 —— 那是假的安心：
// 它完全沒算重建設施的成本，而真正的破台速度就是被那個決定的。
// 實測純掛機 1.19 小時全破，這個檢查卻一路顯示綠燈。
//
// 現在改成跑一次真的模擬。數字會慢一點跑出來，但它不會騙你。
(() => {
  const fmt = (t) => t < 60 ? t.toFixed(0) + " 秒"
    : t < 3600 ? (t / 60).toFixed(1) + " 分"
    : (t / 3600).toFixed(1) + " 小時";

  // 從第 i 境界重新開始，要多久才攢到突破的門檻。
  // 策略：只花一半、留一半（全花光就永遠存不到突破門檻）。
  // 不點擊、不吃機緣、不打怪 —— 這是最保守的下限。
  function timeToNext(i) {
    const s = State.create();
    s.realm = i;
    const need = CONTENT.realms[i + 1].requirement;
    let t = 0;

    // 開局沒產量，先靠打坐（假設每秒 5 下）買到第一座設施
    while (Economy.totalRate(s) <= 0 && t < 3600) {
      s.money += Economy.clickPower(s) * 5;
      t += 1;
      for (const g of CONTENT.generators) {
        const c = Economy.costOf(g, s.owned[g.id], s);
        if (c <= s.money) { s.money -= c; s.owned[g.id]++; break; }
      }
    }

    let guard = 0;
    while (s.money < need && t < 90 * 24 * 3600 && guard++ < 30000) {
      let bought = true;
      while (bought) {
        bought = false;
        let best = null, br = 0;
        for (const g of CONTENT.generators) {
          const c = Economy.costOf(g, s.owned[g.id], s);
          if (c > s.money / 2) continue;
          const r = g.baseRate / c; // CP 值最高的優先
          if (r > br) { br = r; best = g; }
        }
        if (best) {
          s.money -= Economy.costOf(best, s.owned[best.id], s);
          s.owned[best.id]++;
          bought = true;
        }
      }
      const rate = Economy.totalRate(s);
      if (rate <= 0) break;
      // 事件驅動：直接跳到「下次買得起」或「攢夠門檻」，不要一格一格爬
      let cheapest = Infinity;
      for (const g of CONTENT.generators) {
        cheapest = Math.min(cheapest, Economy.costOf(g, s.owned[g.id], s) * 2);
      }
      const dt = Math.max(Math.min((cheapest - s.money) / rate, (need - s.money) / rate), 0.05);
      s.money += rate * dt;
      t += dt;
    }
    return t;
  }

  const per = [];
  let total = 0;
  for (let i = 0; i < CONTENT.realms.length - 1; i++) {
    const t = timeToNext(i);
    total += t;
    per.push(CONTENT.realms[i + 1].name + " " + fmt(t));
  }

  // 太快就是壞掉了。一小時全破的遊戲沒有放置可言。
  log(total >= 8 * 3600,
      `破台時間：純掛機全破 ${fmt(total)}（至少要 8 小時才合理）`,
      per.join("　"));

  // 每一關都該比前一關久。變快就代表經濟在後期崩了。
  let monotonic = true, badAt = "";
  const times = CONTENT.realms.slice(1).map((r, i) => ({ name: r.name, t: timeToNext(i) }));
  for (let i = 2; i < times.length; i++) {
    if (times[i].t < times[i - 1].t * 0.8) {
      monotonic = false;
      badAt = `${times[i].name}（${fmt(times[i].t)}）比 ${times[i-1].name}（${fmt(times[i-1].t)}）還快`;
      break;
    }
  }
  log(monotonic, "破台節奏：越後面的境界越久（變快就是經濟崩了）", badAt);

  const d = document.createElement("div");
  d.className = "case";
  d.style.color = "#8b93a7";
  d.textContent = "（各關耗時）" + per.join("　");
  out.appendChild(d);
})();

// --- 總結 ----------------------------------------------------
const s = document.getElementById("summary");
s.className = failed === 0 ? "ok" : "bad";
s.textContent = failed === 0
  ? `全部通過（${passed} 項）`
  : `${failed} 項失敗、${passed} 項通過`;
</script>
</body>
</html>
